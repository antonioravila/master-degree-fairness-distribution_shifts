[project]
name = "master-degree-fairness-distribution-shifts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fairlearn>=0.13.0",
    "folktables>=0.0.12",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "ruff>=0.15.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[project.scripts]
download-data = "src.tools.download_acs_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.format]
quote-style = "single"
