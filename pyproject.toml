[project]
name = "fairness-distribution-shifts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fairlearn>=0.13.0",
    "folktables>=0.0.12",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "requests>=2.32.5",
    "ruff>=0.15.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
